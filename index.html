<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دليل مؤشرات الأداء المؤسسية | جمعية عناية الصحية</title>
<style>
:root{
  --green:#23866f; --green-dark:#176554; --green-soft:#e9f5f1;
  --red:#c94d45; --charcoal:#3f4343; --gray:#6f7775; --line:#e4e9e7;
  --paper:#f7f9f8; --white:#fff; --shadow:0 14px 35px rgba(28,63,54,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:#202826;font-family:"Tahoma","Arial",sans-serif}
button,input,select{font:inherit}
.shell{max-width:1500px;margin:auto;padding:0 26px 50px}
.hero{margin:22px 0 18px;background:linear-gradient(135deg,var(--green-dark),var(--green));border-radius:28px;min-height:240px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero:before{content:"";position:absolute;width:520px;height:520px;border:1px solid rgba(255,255,255,.13);border-radius:50%;left:-160px;top:-260px}
.hero:after{content:"";position:absolute;width:340px;height:340px;border:70px solid rgba(255,255,255,.045);border-radius:50%;left:100px;bottom:-260px}
.hero-inner{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:30px;padding:34px 42px}
.brand{display:flex;align-items:center;gap:24px}
.logo-box{background:#fff;border-radius:20px;padding:12px 18px;width:190px;box-shadow:0 8px 22px rgba(0,0,0,.08)}
.logo-box img{display:block;width:100%;height:auto}
.eyebrow{font-size:14px;opacity:.82;margin-bottom:9px}
h1{font-size:34px;margin:0 0 10px;line-height:1.35}
.subtitle{font-size:16px;opacity:.9;max-width:720px;line-height:1.8}
.total{min-width:160px;text-align:center;border-right:1px solid rgba(255,255,255,.24);padding-right:28px}
.total strong{display:block;font-size:46px;line-height:1}
.total span{display:block;margin-top:9px;font-size:14px;opacity:.86}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:18px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;cursor:pointer;transition:.18s;box-shadow:0 6px 18px rgba(31,57,50,.035);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;right:0;top:0;width:5px;height:100%;background:var(--green)}
.card:nth-child(2):before{background:var(--red)}
.card:hover,.card.active{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#cbd8d4}
.card.active{background:linear-gradient(180deg,#fff,var(--green-soft))}
.card .n{font-size:30px;font-weight:800;color:var(--green-dark);margin-bottom:7px}
.card .t{font-size:16px;font-weight:700}
.card .s{font-size:12px;color:var(--gray);margin-top:6px}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.toolbar{padding:20px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 310px auto;gap:12px;align-items:center}
.search{position:relative}
.search input{width:100%;height:48px;border:1px solid #dce4e1;border-radius:14px;padding:0 44px 0 14px;background:#fbfcfc;outline:none}
.search input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(35,134,111,.1)}
.search:after{content:"⌕";position:absolute;right:16px;top:8px;font-size:27px;color:var(--green)}
select{height:48px;border:1px solid #dce4e1;border-radius:14px;padding:0 13px;background:#fbfcfc;outline:none;color:#26312e;max-width:100%}
.reset{height:48px;border:0;border-radius:14px;padding:0 18px;background:var(--charcoal);color:#fff;cursor:pointer}
.section-head{padding:20px 22px 12px;display:flex;justify-content:space-between;gap:15px;align-items:end}
.section-head h2{margin:0;font-size:22px;color:var(--green-dark)}
.section-head p{margin:5px 0 0;color:var(--gray);font-size:13px}
.result-count{font-size:13px;color:var(--gray);white-space:nowrap}
.table-wrap{overflow:auto;padding:0 22px 10px}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:850px}
th{background:var(--charcoal);color:#fff;padding:14px 15px;text-align:right;font-size:13px;position:sticky;top:0;z-index:2}
th:first-child{border-radius:0 12px 0 0} th:last-child{border-radius:12px 0 0 0}
td{padding:15px;border-bottom:1px solid #edf0ef;vertical-align:top;line-height:1.75;font-size:13.5px}
tbody tr:hover td{background:#f8fbfa}
td.indicator{font-weight:700;color:#24312d}
.tag{display:inline-block;background:var(--green-soft);color:var(--green-dark);border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:700;white-space:normal}
.pagination{display:flex;align-items:center;justify-content:center;gap:7px;padding:18px 22px 24px}
.pagination button{border:1px solid #dbe4e1;background:#fff;color:#34413d;border-radius:10px;min-width:38px;height:38px;cursor:pointer}
.pagination button.active{background:var(--green);border-color:var(--green);color:#fff}
.pagination button:disabled{opacity:.4;cursor:default}
.empty{text-align:center;padding:55px 20px;color:var(--gray)}
.footer{text-align:center;color:#8a918f;font-size:12px;padding:22px 0 0}
@media(max-width:980px){
 .cards{grid-template-columns:repeat(2,1fr)}
 .hero-inner{align-items:flex-start;flex-direction:column}
 .total{border-right:0;border-top:1px solid rgba(255,255,255,.24);padding:18px 0 0;width:100%;text-align:right}
 .toolbar{grid-template-columns:1fr 1fr}.reset{grid-column:1/-1}
}
@media(max-width:620px){
 .shell{padding:0 12px 30px}.hero{border-radius:20px}.hero-inner{padding:25px 20px}
 .brand{align-items:flex-start;flex-direction:column}.logo-box{width:150px}h1{font-size:26px}
 .cards{grid-template-columns:1fr 1fr;gap:9px}.card{padding:16px}.card .n{font-size:25px}.card .t{font-size:14px}
 .toolbar{grid-template-columns:1fr}.reset{grid-column:auto}.section-head{align-items:flex-start;flex-direction:column}
}
</style>
</head>

const META = {
 strategic:{title:"مؤشرات الأداء الاستراتيجي",desc:"استعراض المؤشرات وفق الهدف الاستراتيجي.",filterKey:"goal",filterLabel:"جميع الأهداف الاستراتيجية",cols:[["goal","الهدف الاستراتيجي"],["indicator","المؤشر"],["description","شرح المؤشر"]]},
 operational:{title:"مؤشرات الأداء التشغيلي",desc:"استعراض المؤشرات التشغيلية وفق مسمى الإدارة.",filterKey:"admin",filterLabel:"جميع الإدارات",cols:[["admin","مسمى الإدارة"],["indicator","المؤشر"],["description","شرح المؤشر"]]},
 quality:{title:"مؤشرات الجودة",desc:"استعراض مؤشرات الجودة المحدثة كما وردت في دليل الإجراءات.",filterKey:null,filterLabel:"جميع مؤشرات الجودة",cols:[["indicator","المؤشر"],["description","شرح المؤشر"]]},
 excellence:{title:"مؤشرات التميز المؤسسي",desc:"استعراض عناصر ومؤشرات التميز المؤسسي وفق المعايير الرئيسية.",filterKey:"main",filterLabel:"جميع المعايير الرئيسية",cols:[["main","المعيار الرئيسي"],["classification","التصنيف"],["sub","المعيار الفرعي"],["indicator","المؤشر (العنصر)"],["owner","المسؤول"],["sector","القطاع"]]},
 jobs:{title:"مؤشرات الأوصاف الوظيفية",desc:"استعراض المؤشرات المحدثة وفق المسمى الوظيفي.",filterKey:"job",filterLabel:"جميع المسميات الوظيفية",cols:[["job","المسمى الوظيفي"],["indicator","المؤشر"],["description","شرح المؤشر"]]}
};
const ORDER=["strategic","operational","quality","excellence","jobs"];
const CARD_SUB={strategic:"استراتيجي",operational:"تشغيلي",quality:"جودة",excellence:"تميز مؤسسي",jobs:"وظيفي"};
let state={type:"strategic",q:"",filter:"",page:1,pageSize:20};

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function normalize(s){return String(s??"").toLowerCase().replace(/\s+/g," ").trim()}
function unique(arr){return [...new Set(arr.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ar"))}

function buildCards(){
 const el=document.getElementById("cards");
 el.innerHTML=ORDER.map(k=>`<div class="card ${state.type===k?"active":""}" data-type="${k}">
   <div class="n">${DATA[k].length.toLocaleString("ar-SA")}</div>
   <div class="t">${META[k].title}</div><div class="s">${CARD_SUB[k]}</div></div>`).join("");
 el.querySelectorAll(".card").forEach(c=>c.onclick=()=>{state.type=c.dataset.type;state.q="";state.filter="";state.page=1;render()});
}

function setupFilter(){
 const meta=META[state.type], sel=document.getElementById("filterSelect");
 if(!meta.filterKey){sel.innerHTML=`<option>${meta.filterLabel}</option>`;sel.disabled=true;return}
 sel.disabled=false;
 const vals=unique(DATA[state.type].map(x=>x[meta.filterKey]));
 sel.innerHTML=`<option value="">${meta.filterLabel}</option>`+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
 sel.value=state.filter;
}

function filtered(){
 const meta=META[state.type], q=normalize(state.q);
 return DATA[state.type].filter(row=>{
   const okFilter=!meta.filterKey||!state.filter||row[meta.filterKey]===state.filter;
   const okQ=!q||Object.values(row).some(v=>normalize(v).includes(q));
   return okFilter&&okQ;
 });
}

function renderTable(rows){
 const meta=META[state.type], wrap=document.getElementById("tableWrap");
 if(!rows.length){wrap.innerHTML=`<div class="empty">لا توجد نتائج مطابقة للبحث الحالي.</div>`;return}
 const head=meta.cols.map(c=>`<th>${c[1]}</th>`).join("");
 const body=rows.map(r=>`<tr>${meta.cols.map(([k])=>{
   const cls=k==="indicator"?"indicator":"";
   const val=(k===meta.filterKey)?`<span class="tag">${esc(r[k])}</span>`:esc(r[k]);
   return `<td class="${cls}">${val||"—"}</td>`}).join("")}</tr>`).join("");
 wrap.innerHTML=`<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function renderPagination(total){
 const pages=Math.max(1,Math.ceil(total/state.pageSize)), el=document.getElementById("pagination");
 if(state.page>pages) state.page=pages;
 if(pages<=1){el.innerHTML="";return}
 let nums=[];
 const from=Math.max(1,state.page-2), to=Math.min(pages,state.page+2);
 for(let i=from;i<=to;i++) nums.push(i);
 el.innerHTML=`<button data-p="${state.page-1}" ${state.page===1?"disabled":""}>‹</button>`+
 nums.map(i=>`<button data-p="${i}" class="${i===state.page?"active":""}">${i.toLocaleString("ar-SA")}</button>`).join("")+
 `<button data-p="${state.page+1}" ${state.page===pages?"disabled":""}>›</button>`;
 el.querySelectorAll("button:not(:disabled)").forEach(b=>b.onclick=()=>{state.page=Number(b.dataset.p);renderBody();window.scrollTo({top:document.querySelector(".panel").offsetTop-15,behavior:"smooth"})});
}

function renderBody(){
 const rows=filtered(), start=(state.page-1)*state.pageSize;
 document.getElementById("resultCount").textContent=`${rows.length.toLocaleString("ar-SA")} مؤشر`;
 renderTable(rows.slice(start,start+state.pageSize));
 renderPagination(rows.length);
}

function render(){
 buildCards();
 const meta=META[state.type];
 document.getElementById("sectionTitle").textContent=meta.title;
 document.getElementById("sectionDesc").textContent=meta.desc;
 document.getElementById("searchInput").value=state.q;
 setupFilter(); renderBody();
}

document.getElementById("searchInput").addEventListener("input",e=>{state.q=e.target.value;state.page=1;renderBody()});
document.getElementById("filterSelect").addEventListener("change",e=>{state.filter=e.target.value;state.page=1;renderBody()});
document.getElementById("resetBtn").onclick=()=>{state.q="";state.filter="";state.page=1;render()};
document.getElementById("grandTotal").textContent=ORDER.reduce((s,k)=>s+DATA[k].length,0).toLocaleString("ar-SA");
render();
</script>
</body>
</html>
